name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      # TODO: set up this repo's toolchain (language runtime, build tools)
      # before the steps below — e.g. actions/setup-python, a compiler, etc.

      - name: Setup
        run: just setup

      - name: Check
        run: just check

      - name: Test
        run: just test
